<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sehatalay (सेहतालय) — Doctors, Labs & Pharmacies in Dewas</title>
    <meta name="description" content="Sehatalay — Sehat Ka Ghar. A free, neutral directory of owner-reviewed doctors, diagnostic labs and pharmacies in Dewas, Madhya Pradesh. Hindi and English." />
    <meta name="theme-color" content="#0f766e" />
    <meta property="og:title" content="Sehatalay (सेहतालय) — Sehat Ka Ghar" />
    <meta property="og:description" content="Doctors, labs and pharmacies in Dewas, Madhya Pradesh." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sehatalaya.theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
